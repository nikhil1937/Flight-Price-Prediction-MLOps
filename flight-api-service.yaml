# Exposes the Flight Prediction API through an Azure LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: flight-api-service
  namespace: flight-api
spec:
  type: LoadBalancer
  selector:
    app: flight-api
  ports:
    - name: http
      protocol: TCP
      # Clients connect to the external IP on port 80.
      port: 80
      # Forward traffic to Flask inside the container on port 5007.
      targetPort: 5007
