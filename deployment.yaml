apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-api-deployment
  namespace: flight-api
  labels:
    app: flight-api

spec:
  # Start with one replica; increase later if needed.
  replicas: 1

  selector:
    matchLabels:
      app: flight-api

  template:
    metadata:
      labels:
        app: flight-api

    spec:
      containers:
        - name: flight-api
          # Uses the Flight API image stored in Azure Container Registry.
          image: flightapiregistry1233.azurecr.io/flight-api-imagee:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              # Flask runs on 0.0.0.0:5007.
              containerPort: 5007
              protocol: TCP

          # Initial resource requests and limits.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
